<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Shorts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 18px;
      font-size: 25px;
      font-weight: bold;
      color: #b69aff;
    }
    .feed {
      height: 82vh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
    }
    .video {
      height: 82vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
      background: linear-gradient(145deg, #25134c, #111, #4c1764);
      font-size: 25px;
      text-align: center;
    }
    .video p { font-size: 16px; }
  </style>
</head>
<body>
  <header>✦ Nova Shorts</header>
  <main class="feed">
    <section class="video">
      <div>🎬</div>
      <h2>Welcome to Nova Shorts</h2>
      <p>आपकी शॉर्ट वीडियो दुनिया!</p>
    </section>
    <section class="video">
      <div>🚀</div>
      <h2>Dream Big</h2>
      <p>स्वाइप करके अगली स्क्रीन देखें ↑</p>
    </section>
    <section class="video">
      <div>💜</div>
      <h2>Made with Nova</h2>
      <p>आपका मनोरंजन, आपका Nova Shorts</p>
    </section>
  </main>
</body>
</html>
